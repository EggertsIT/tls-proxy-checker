name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Verify signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          object_type="$(printf '%s' "${tag_ref}" | jq -r '.object.type')"
          tag_sha="$(printf '%s' "${tag_ref}" | jq -r '.object.sha')"
          if [[ "${object_type}" != "tag" ]]; then
            echo "Release tag must be an annotated, signed tag." >&2
            exit 1
          fi
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
          verified="$(printf '%s' "${tag_object}" | jq -r '.verification.verified')"
          reason="$(printf '%s' "${tag_object}" | jq -r '.verification.reason')"
          if [[ "${verified}" != "true" ]]; then
            echo "GitHub did not verify the release tag signature: ${reason}" >&2
            exit 1
          fi

  build-linux:
    name: ${{ matrix.name }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            name: Linux x86-64 (glibc 2.17)
            runner: ubuntu-22.04
            metadata_suffix: ""
          - architecture: aarch64
            name: Linux ARM64 (glibc 2.17)
            runner: ubuntu-22.04-arm
            metadata_suffix: -linux-aarch64
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      METADATA_SUFFIX: ${{ matrix.metadata_suffix }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build release assets on glibc 2.17
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/run_linux_release_build.sh "${ARCHITECTURE}"

      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check "SHA256SUMS${METADATA_SUFFIX}"

      - name: Smoke-test release binary on the GitHub runner
        run: |
          "./release-assets/tls-proxy-checker-linux-${ARCHITECTURE}" --version
          "./release-assets/tls-proxy-checker-linux-${ARCHITECTURE}" --help > /dev/null
          jq --exit-status '
            .within_maximum == true and
            .maximum_allowed_glibc == "2.17"
          ' "release-assets/glibc-requirements${METADATA_SUFFIX}.json"
          jq --exit-status --arg architecture "${ARCHITECTURE}" '
            select(.artifact.architecture == $architecture) |
            .build.python_distribution as $python |
            ($python.url | type) == "string" and
            ($python.url | startswith("https://")) and
            ($python.sha256 | type) == "string" and
            ($python.sha256 | test("^[0-9a-f]{64}$"))
          ' "release-assets/BUILDINFO${METADATA_SUFFIX}.json"

      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: release-assets/SHA256SUMS${{ matrix.metadata_suffix }}

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.architecture }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true

      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS SHA256SUMS-linux-aarch64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "TLS Proxy Checker ${GITHUB_REF_NAME}"
